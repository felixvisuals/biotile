[project]
name = "biotile"
version = "0.1.0"
description = "BIOTILE: from a photo of a colonised natural surface to a printable tool set for bioreceptive habitat tiles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12",
    "trimesh>=4.4",
    "manifold3d>=2.5",
    "fast-simplification>=0.1.9",
    "pillow>=10.3",
    "opencv-contrib-python-headless>=4.9",
    "surfalize==0.16.6",
    "reportlab>=4.2",
    "lxml>=5.2",
    "networkx>=3.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "httpx>=0.27",
    "boto3>=1.34",
    "rq>=1.16",
    "redis>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/biotile_geometry",
    "services/api/biotile_api",
    "services/worker/biotile_worker",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP037"]
